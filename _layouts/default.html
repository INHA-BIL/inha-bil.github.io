<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.experimental_home %}<link rel="stylesheet" href="{{ '/assets/css/playful-home.css' | relative_url }}">{% endif %}
  </head>
  <body{% if page.experimental_home %} class="playful-home"{% endif %}>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% if page.experimental_home %}<script src="{{ '/assets/js/gp-curve.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
