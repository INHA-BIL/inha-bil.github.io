{% assign current_url = page.url | remove: 'index.html' %}
<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="brand-mark" aria-hidden="true">
        <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="">
      </span>
      <span class="brand-text">
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-affiliation">Department of Statistics and Data Science</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {% for item in site.navigation %}
        {% assign item_url = item.url %}
        <a href="{{ item.url | relative_url }}" class="{% if current_url == item_url %}is-active{% endif %}">
          {{ item.title }}
        </a>
      {% endfor %}
      <a class="nav-github" href="https://github.com/bayesian-inference-lab" rel="noreferrer" aria-label="Bayesian Inference LAB on GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span class="github-label">GitHub <span aria-hidden="true">↗</span></span>
      </a>
    </nav>
  </div>
</header>
